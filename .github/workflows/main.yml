name: main

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV, RUST_NIGHTLY
          cargo-tools: CARGO_NEXTEST_VERSION

      # execute
      - name: Build
        run: cargo build --workspace --all-targets --verbose --locked --color always
      - name: Tests
        if: success() || failure()
        run: cargo nextest run --verbose --workspace --profile ci
      - name: Flake Check
        if: success() || failure()
        shell: bash
        run: ./.github/scripts/flake-report.sh
      - name: Docs
        if: success() || failure()
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo +${{ env.RUST_NIGHTLY }} doc --no-deps --verbose --workspace --all-features --locked
      - name: Doc Tests
        if: success() || failure()
        run: cargo test --doc --verbose --workspace --all-features

  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV

      # execute
      - name: Release Build
        run: cargo build --workspace --verbose --locked --color always --release

  static-analysis:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_LATEST
          rust-components: clippy, rustfmt
          cargo-tools: CARGO_WORKSPACES_VERSION, CARGO_ENSURE_NO_CYCLIC_DEPS_VERSION, CARGO_ENSURE_NO_DEFAULT_FEATURES_VERSION, CARGO_DENY_VERSION, CARGO_SORT_VERSION

      # execute
      - name: Flake report parser tests
        shell: bash
        run: ./.github/scripts/flake-report.test.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Source Format
        if: success() || failure()
        run: cargo fmt --all -- --check
      - name: Cargo.toml Format
        if: success() || failure()
        run: cargo sort --check --grouped --workspace
      - name: Cyclic Dependencies
        if: success() || failure()
        run: cargo ensure-no-cyclic-deps
      - name: Default Features
        if: success() || failure()
        run: cargo ensure-no-default-features
      - name: Dependency Validation
        if: success() || failure()
        run: cargo deny --all-features --workspace --color always check all

  no-std:
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV

      # execute
      #
      # The runtime shim is injected into the dependency graph of every crate this tool
      # instruments, so a shim that links `std` cannot be instrumented into a tree that does not
      # have it. A target with no `std` in its sysroot is the only thing that proves the shim does
      # not, since on a hosted target it would link happily either way.
      - name: Add bare-metal target
        run: rustup target add thumbv7em-none-eabi
      - name: Build the runtime shim without std
        run: cargo build -p cargo-gamma-rt --target thumbv7em-none-eabi --verbose --locked --color always

  spell-check:
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust-toolchain: RUST_LATEST
          cargo-tools: CARGO_SPELLCHECK_VERSION

      - name: Check Spelling
        run: cargo spellcheck --cfg spellcheck.toml --code 1

  extended-analysis:
    name: extended-analysis (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    needs: [testing, static-analysis]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_NIGHTLY
          rust-components: miri
          cargo-tools: CARGO_UDEPS_VERSION, CARGO_CAREFUL_VERSION, CARGO_NEXTEST_VERSION

      # execute
      - name: Udeps
        run: cargo +${{ env.RUST_NIGHTLY }} udeps --all-features --workspace --color always
      - name: Careful
        if: success() || failure()
        run: cargo +${{ env.RUST_NIGHTLY }} careful nextest run --all-features --workspace --color always --target ${{ matrix.target }}

# We disable Miri since it is not actually able to test any of the app's unsafe code, since the
# unsafe code is around I/O and Miri can't do I/O
#
#      - name: Miri
#        if: success() || failure()
#        run: cargo +${{ env.RUST_NIGHTLY }} miri test --all-features --workspace

  loom:
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV

      # execute
      #
      # Miri cannot reach this code — the unsafe here is I/O-bound — and a test with real threads
      # only ever samples one interleaving. loom enumerates them, so a weakened notify or a lost
      # reference-count decrement fails here and nowhere else. Its own suite is not run: the models
      # live behind `--cfg loom`, which recompiles the crate against loom's scheduler.
      - name: Loom Models
        run: cargo test -p cargo-gamma-lib --lib hubs::loom_models
        env:
          RUSTFLAGS: "--cfg loom"
          LOOM_MAX_PREEMPTIONS: "3"
      - name: Interrupt Loom Model
        run: cargo test -p cargo-gamma-unsafe --lib interrupt::loom_models
        env:
          RUSTFLAGS: "--cfg loom"
          LOOM_MAX_PREEMPTIONS: "3"
      - name: Runtime Loom Model
        run: cargo test -p cargo-gamma-rt --lib loom_models
        env:
          RUSTFLAGS: "--cfg loom"
          LOOM_MAX_PREEMPTIONS: "3"

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust-toolchain: RUST_NIGHTLY
          rust-components: rust-src

      # TSan is available for the Linux target. These bounded fixtures exercise the same shared
      # state as the platform integrations without forking from or delivering fatal signals to an
      # instrumented multithreaded harness.
      - name: Parallel shared-state fixtures under ThreadSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          RUSTDOCFLAGS: "-Zsanitizer=thread"
        run: |
          cargo +${{ env.RUST_NIGHTLY }} test -Zbuild-std -p cargo-gamma-unsafe --lib parallel_shared_state --target x86_64-unknown-linux-gnu -- --test-threads=1
          cargo +${{ env.RUST_NIGHTLY }} test -Zbuild-std -p cargo-gamma-rt --lib parallel_shared_state --target x86_64-unknown-linux-gnu -- --test-threads=1

  delegated-cgroups:
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV

      # execute
      #
      # The tests this runs are `#[ignore]`d in every other job, because creating a memory-limited
      # cgroup needs one delegated to the process and no ordinary runner has one. Ignored is the
      # right answer there — a test that returns early reads as a pass, and these three are the only
      # tests standing behind memory accounting, ceiling enforcement and leaf cleanup, so a green
      # run that quietly skipped them asserts nothing about the feature at all. Ignored everywhere
      # and run nowhere would be no better, which is what this job is for: `systemd-run --scope -p
      # Delegate=yes` hands the process a cgroup subtree of its own to create leaves in.
      - name: Cgroup tests on a delegated host
        run: |
          set -euo pipefail
          binary=$(cargo test -p cargo-gamma-unsafe --lib --no-run --locked --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable | select(. != null)' | head -n 1)
          echo "running $binary"
          sudo systemd-run --scope --quiet -p Delegate=yes "$binary" --ignored --nocapture --test-threads 1

  mutation-testing:
    if: github.event_name == 'pull_request'
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          enable-wild-linker: true
          rust-toolchain: RUST_NIGHTLY
          cargo-tools: CARGO_MUTANTS_VERSION

      # execute
      - name: Generate PR Diff
        run: git diff origin/main...HEAD >diff.txt
      - name: Mutate Diff
        timeout-minutes: 45
        run: cargo mutants --test-workspace=true --colors=never --jobs=2 --build-timeout=120 --cap-lints=true --in-diff diff.txt

  coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_NIGHTLY
          rust-components: llvm-tools-preview
          cargo-tools: CARGO_LLVM_COV_VERSION

      # execute
      - name: Generate Coverage
        run: cargo +${{ env.RUST_NIGHTLY }} llvm-cov --all-features --workspace --lcov --output-path lcov-all.info
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-all.info
          fail_ci_if_error: true
