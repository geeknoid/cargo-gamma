[package]
name = "cargo-gamma-lib"
description = "Internal library for cargo-gamma"
keywords = ["cargo", "mutation-testing", "testing"]
categories = ["development-tools::testing"]
readme = "README.md"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true

[dependencies]
blake3.workspace = true
camino.workspace = true
cargo-gamma-rt.workspace = true
cargo_metadata.workspace = true
clap.workspace = true
clap_complete.workspace = true
ignore.workspace = true
owo-colors.workspace = true
proc-macro2.workspace = true
reflink-copy.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
syn.workspace = true
toml.workspace = true
toml_edit.workspace = true
walkdir.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
# Exposes the crate's internal modules so that the integration tests in `tests/` can drive them
# directly. Enabled only by this crate's dev-dependency on itself; never enable it from outside.
internals = []

[dev-dependencies]
cargo-gamma-lib = { path = ".", features = ["internals"] }
tempfile.workspace = true

[lints]
workspace = true
