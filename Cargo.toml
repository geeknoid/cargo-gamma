[workspace]
members = [
    "crates/cargo-gamma",
    "crates/cargo-gamma-attrs",
    "crates/cargo-gamma-lib",
    "crates/cargo-gamma-rt",
]
exclude = ["crates/cargo-gamma-testdata"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/geeknoid/cargo-gamma"
rust-version = "1.90.0"
homepage = "https://github.com/geeknoid/cargo-gamma"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"

# Allow cfg attributes for coverage builds and custom feature flags
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# Explicitly enabled lints from the `restriction` group.
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
as_underscore = "warn"
as_pointer_underscore = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
map_err_ignore = "warn"
missing_asserts_for_indexing = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
panic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
semicolon_outside_block = "warn"
std_instead_of_core = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

# Explicitly necessary
multiple_crate_versions = "allow"

# Not needed for a tool
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[workspace.dependencies]
blake3 = { version = "1.5", default-features = false, features = ["std"] }
camino = { version = "1.1", default-features = false }
cargo-gamma-lib = { version = "0.1.0", path = "crates/cargo-gamma-lib", default-features = false }
cargo-gamma-rt = { version = "0.1.0", path = "crates/cargo-gamma-rt", default-features = false }
cargo_metadata = { version = "0.19", default-features = false }
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "color",
    "help",
    "error-context",
    "usage",
    "suggestions",
    "env",
    "wrap_help",
] }
clap_complete = { version = "4.5", default-features = false }
ignore = { version = "0.4", default-features = false }
libc = { version = "0.2", default-features = false, features = ["std"] }
mimalloc = { version = "0.1", default-features = false }
owo-colors = { version = "4.1", default-features = false }
proc-macro2 = { version = "1.0", default-features = false, features = ["span-locations"] }
reflink-copy = { version = "0.1", default-features = false }
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
strsim = { version = "0.11", default-features = false }
syn = { version = "2.0", default-features = false, features = [
    "full",
    "parsing",
    "printing",
    "visit",
    "extra-traits",
    "clone-impls",
    "proc-macro",
] }
tempfile = { version = "3.14", default-features = false }
terminal_size = { version = "0.4", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde", "std"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
walkdir = { version = "2.5", default-features = false }
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
